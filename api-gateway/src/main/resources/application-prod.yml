# API Gateway - Production Profile
spring:
  application:
    name: api-gateway
  profiles:
    active: prod
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**

        - id: admin-user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/admin/**

        - id: auth-alias
          uri: http://user-service:8081
          predicates:
            - Path=/api/auth/**

        - id: dossier-service
          uri: http://dossier-service:8082
          predicates:
            - Path=/api/dossiers/**

        - id: workflow-service
          uri: http://workflow-service:8083
          predicates:
            - Path=/api/workflow/**

        - id: paiement-service
          uri: http://paiement-service:8084
          predicates:
            - Path=/api/paiements/**

        - id: notification-service
          uri: http://notification-service:8085
          predicates:
            - Path=/api/notifications/**

        - id: document-service
          uri: http://document-service:8086
          predicates:
            - Path=/api/documents/**

server:
  port: 8080
  servlet:
    context-path: /

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
